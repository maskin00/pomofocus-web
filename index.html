<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomofocus Installation Guide</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            background-color: white;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
            color: #1a1a1a;
            font-weight: 700;
        }
        
        .instruction-text {
            text-align: center;
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .screenshot {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .section {
            margin-bottom: 20px;
        }
        
        .section:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section">
            <h1>Pomofocus Installed</h1>
            <p class="instruction-text">
                Click the puzzle piece (1) in the top right of your browser. Then, click the little pin (2) next to the extension:
            </p>
            <img src="screenshot1.png" alt="Step 1: Pin the extension" class="screenshot">
        </div>
        
        <div class="section">
            <p class="instruction-text">
                Open the extension (3) on any page to start using Pomofocus:
            </p>
            <img src="screenshot2.png" alt="Step 2: Open the extension" class="screenshot">
        </div>
    </div>
</body>
</html>
